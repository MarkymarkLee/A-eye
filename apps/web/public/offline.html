<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e11" />
    <title>Offline | A-eye</title>
    <script>
      (function(){try{var p=localStorage.getItem("aeye:theme")||"system";var d=p==="dark"||(p==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";}catch(e){document.documentElement.dataset.theme="dark";}})();
    </script>
    <style>
      :root {
        --bg: #0c0e11;
        --ink: #eceef1;
        --muted: #9aa3ad;
        --line: #2a2f36;
        --accent: #ff6a2b;
      }
      :root[data-theme="light"] {
        --bg: #f7f6f3;
        --ink: #15130f;
        --muted: #5f5a52;
        --line: #e3e0d9;
        --accent: #b33a0b;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      main { max-width: 34ch; text-align: center; }
      svg { display: block; margin: 0 auto 20px; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: var(--muted); }
      button {
        margin-top: 24px;
        padding: 10px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="var(--accent)" stroke-width="3" />
        <circle cx="12" cy="12" r="3" fill="var(--ink)" />
      </svg>
      <h1>You&rsquo;re offline</h1>
      <p>A-eye needs a connection to load questions and send answers. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
