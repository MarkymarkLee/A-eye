<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e11" />
    <title>Offline | A-eye</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0c0e11;
        color: #eceef1;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      main { max-width: 34ch; text-align: center; }
      svg { display: block; margin: 0 auto 20px; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: #9aa3ad; }
      button {
        margin-top: 24px;
        padding: 10px 20px;
        border: 1px solid #2a2f36;
        border-radius: 999px;
        background: transparent;
        color: #ff6a2b;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { border-color: #ff6a2b; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#ff6a2b" stroke-width="3" />
        <circle cx="12" cy="12" r="3" fill="#eceef1" />
      </svg>
      <h1>You&rsquo;re offline</h1>
      <p>A-eye needs a connection to load questions and send answers. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
