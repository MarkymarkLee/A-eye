<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>A-eye table tent</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  /* US Letter landscape, fold along the dashed line: top panel is upside down so both faces read upright. */
  @page { size: 11in 8.5in; margin: 0; }
  :root { --bg: #f7f6f3; --surface: #fff; --surface-2: #efede8; --ink: #15130f; --muted: #5f5a52; --line: #e3e0d9;
    --accent: #ff5b1f; --accent-2: #ff3d6e; --accent-ink: #b33a0b; --accent-soft: #fff0e8; --warn: #9a6200; --warn-soft: #fdf3dd; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 11in; height: 8.5in; }
  body { font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden; }
  .sheet { width: 11in; height: 8.5in; display: grid; grid-template-rows: 1fr 1fr; }
  .panel { position: relative; overflow: hidden; padding: 0.38in 0.55in; display: grid; grid-template-columns: 2.85in 1fr; gap: 0.45in; align-items: center; }
  .panel.top { transform: rotate(180deg); border-top: 1.5px dashed #cfcac0; }
  .panel::before { content: ""; position: absolute; width: 5in; height: 5in; right: -1.6in; top: -2.2in; border-radius: 50%; background: radial-gradient(circle, #ffb08a, transparent 65%); opacity: .5; filter: blur(40px); }
  .qr-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 10px; text-align: center; box-shadow: 0 2px 0 rgb(21 19 15 / .03), 0 18px 40px -20px rgb(60 48 30 / .35); }
  .qr svg { width: 100%; height: auto; display: block; }
  .url { margin-top: 7px; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .copy { position: relative; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .brand svg { width: 32px; height: 32px; }
  h1 { margin-top: 14px; font-size: 40px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; }
  h1 .grad { background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 8px; font-size: 18px; font-weight: 600; color: var(--muted); }
  .steps { margin-top: 16px; display: flex; gap: 10px; }
  .step { flex: 1; display: flex; gap: 9px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px 7px 7px; font-size: 14px; font-weight: 600; line-height: 1.15; }
  .n { flex: none; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-size: 14px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .note { margin-top: 14px; display: inline-flex; gap: 9px; align-items: center; background: var(--warn-soft); border-radius: 999px; padding: 7px 14px 7px 7px; font-size: 13px; color: #5c3d00; }
  .note b { background: #fff; color: var(--warn); border: 1px solid #f1dfb3; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="sheet">
  {{PANEL_TOP}}
  {{PANEL}}
</div>
</body>
</html>
